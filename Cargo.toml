[package]
edition = "2024"
name = "esp-mqtt-project"
rust-version = "1.95"
version = "0.1.0"

[[bin]]
name = "hello-esp"
path = "./src/bin/hello_esp.rs"
required-features = ["esp"]

[[bin]]
name = "hello-qemu"
path = "./src/bin/hello_qemu.rs"
required-features = ["qemu"]

[[bin]]
name = "mqtt-client"
path = "./src/bin/mqtt_client.rs"
required-features = ["esp"]

[features]
esp = [
    "dep:esp-hal",
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-backtrace",
    "dep:esp-println",
    "dep:esp-alloc",
]
qemu = [
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:cortex-m-semihosting",
    "dep:critical-section",
    "dep:panic-semihosting",
    "dep:embassy-time-driver",
    "embassy-executor/platform-cortex-m",
    "embassy-executor/executor-thread",
    "embassy-time/tick-hz-1_000",
]

[dependencies]
# --- ESP platform (enabled by the `esp` feature) ---
esp-hal = { version = "1.1.1", optional = true, features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.3.0", optional = true, features = [
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32s3",
    "log-04", ] }
esp-radio = { version = "0.18.0", optional = true, features = [
    "esp-alloc",
    "esp32s3",
    "log-04",
    "unstable",
    "wifi"] }
esp-bootloader-esp-idf = { version = "0.5.0", optional = true, features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.19.0", optional = true, features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.17.0", optional = true, features = ["esp32s3", "log-04"] }
esp-alloc = { version = "0.10.0", optional = true, features = ["esp32s3"] }

# --- QEMU / Cortex-M3 LM3S6965EVB (enabled by the `qemu` feature) ---
cortex-m = { version = "0.7", optional = true, features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", optional = true }
cortex-m-semihosting = { version = "0.5", optional = true }
embassy-time-driver = { version = "0.2", optional = true }
panic-semihosting = { version = "0.6", optional = true }
critical-section = { version = "1", optional = true }

# --- Shared ---
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "log", "medium-ethernet", "proto-ipv4"] }

static_cell = "2.1.1"
log = "0.4.27"

# MQTT client (no_std, async, uses alloc for heap-backed buffers, log crate for logging)
rust-mqtt = { version = "0.5.1", default-features = false, features = ["v5", "log", "log-level-info"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2 # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
